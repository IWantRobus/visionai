<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISIONAI Studio — Neural Image Engine</title>
<meta name="description" content="Free unlimited AI image generation. No sign-up, no keys. Powered by the Perchance image API.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>👁️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#03040a; --panel:rgba(16,20,40,.72); --panel2:rgba(8,12,30,.85);
    --neon:#00f0ff; --neon2:#a855f7; --text:#d8faff; --muted:#5f7a95;
    --border:rgba(0,240,255,.22); --glow:0 0 18px rgba(0,240,255,.25);
  }
  body { background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh; overflow-x:hidden; }
  canvas#neural { position:fixed; inset:0; z-index:0; opacity:.55; }
  .scanlines { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,240,255,.025) 0 1px, transparent 1px 3px); }
  header { position:relative; z-index:2; text-align:center; padding:38px 16px 10px; }
  h1 { font-family:'Orbitron',sans-serif; font-size:34px; font-weight:900; letter-spacing:6px; color:var(--neon);
    text-shadow:0 0 12px rgba(0,240,255,.7), 0 0 40px rgba(0,240,255,.35); animation:pulseGlow 3s ease-in-out infinite; }
  @keyframes pulseGlow { 50% { text-shadow:0 0 22px rgba(0,240,255,.95), 0 0 60px rgba(0,240,255,.5); } }
  .sub { font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:5px; color:var(--neon2);
    text-transform:uppercase; margin-top:10px; }
  .sub::before, .sub::after { content:"//"; color:var(--muted); margin:0 8px; }
  .tagline { color:var(--muted); font-size:15px; margin-top:8px; letter-spacing:1px; }
  main { position:relative; z-index:2; max-width:980px; margin:0 auto; padding:0 16px 50px; }
  .studio { background:var(--panel); border:1px solid var(--border); border-radius:4px 20px 4px 20px;
    padding:24px; margin-bottom:26px; backdrop-filter:blur(12px); box-shadow:var(--glow), inset 0 0 60px rgba(0,240,255,.03); }
  label { display:block; font-family:'Orbitron',sans-serif; font-size:10px; color:var(--neon); letter-spacing:2.5px;
    margin:16px 0 7px; text-transform:uppercase; }
  label::before { content:"▮ "; color:var(--neon2); }
  textarea, input, select { background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:var(--text);
    padding:13px; font-size:16px; font-family:'Rajdhani',sans-serif; font-weight:600; width:100%; letter-spacing:.5px; }
  textarea { min-height:90px; resize:vertical; }
  textarea:focus, input:focus, select:focus { outline:none; border-color:var(--neon); box-shadow:var(--glow); }
  select { appearance:none; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:150px; }
  button { cursor:pointer; font-family:'Orbitron',sans-serif; border:none; }
  .generate { width:100%; margin-top:22px; padding:17px; font-size:16px; font-weight:700; letter-spacing:4px; color:#03040a;
    background:linear-gradient(90deg,var(--neon),#7df9ff,var(--neon)); border-radius:8px;
    box-shadow:0 0 22px rgba(0,240,255,.5); transition:transform .15s, box-shadow .3s; text-transform:uppercase; }
  .generate:hover { transform:translateY(-2px); box-shadow:0 0 34px rgba(0,240,255,.8); }
  .generate:disabled { opacity:.4; cursor:wait; transform:none; }
  #status { text-align:center; color:var(--neon); font-size:15px; margin-top:14px; min-height:22px; letter-spacing:1px;
    font-weight:600; text-shadow:0 0 8px rgba(0,240,255,.5); }
  #status::before { content:"▮▮▮ "; color:var(--neon2); }
  #status.err { color:#ff4d6d; text-shadow:0 0 8px rgba(255,77,109,.5); }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:4px 14px 4px 14px; overflow:hidden;
    box-shadow:0 0 14px rgba(0,240,255,.12); }
  .card img { width:100%; display:block; }
  .card .meta { padding:10px 12px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between;
    align-items:center; gap:8px; font-weight:600; }
  .card a { color:var(--neon); text-decoration:none; font-weight:700; white-space:nowrap; text-transform:uppercase; font-size:12px; letter-spacing:1px; }
  .card .p { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .placeholder { border-radius:4px 14px 4px 14px; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(110deg, rgba(8,12,30,.9) 8%, rgba(0,240,255,.12) 18%, rgba(8,12,30,.9) 33%);
    background-size:200% 100%; animation:wave 1.4s linear infinite; color:var(--neon); font-family:'Orbitron',sans-serif;
    font-size:11px; letter-spacing:3px; }
  @keyframes wave { to { background-position:-200% 0; } }
  .empty { color:var(--muted); text-align:center; padding:40px 10px; font-size:15px; grid-column:1/-1; letter-spacing:1px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 16px 40px; z-index:2; position:relative; letter-spacing:2px; }
  footer a { color:var(--neon2); text-decoration:none; }
</style>
</head>
<body>
<canvas id="neural"></canvas>
<div class="scanlines"></div>
<header>
  <h1>VISIONAI STUDIO</h1>
  <div class="sub">Neural Image Engine v2.0</div>
  <div class="tagline">Free · Unlimited · No sign-up · No keys</div>
</header>
<main>
  <div class="studio">
    <label>Description</label>
    <textarea id="prompt" placeholder="A ship sailing through a sea of stars, cinematic lighting..."></textarea>
    <div class="row">
      <div>
        <label>Art Style</label>
        <select id="style">
          <option value="">No style</option>
          <option value="cinematic film still, dramatic lighting">Cinematic</option>
          <option value="digital painting, trending on artstation">Digital Painting</option>
          <option value="concept art, highly detailed">Concept Art</option>
          <option value="professional photography, sharp focus, 85mm">Professional Photo</option>
          <option value="anime screencap, high quality">Anime</option>
          <option value="painted anime style">Painted Anime</option>
          <option value="cute anime style, soft lighting">Cute Anime</option>
          <option value="studio ghibli style">Studio Ghibli</option>
          <option value="oil painting, textured brushwork">Oil Painting</option>
          <option value="watercolor painting">Watercolor</option>
          <option value="fantasy painting, epic composition">Fantasy Painting</option>
          <option value="pixel art, 16-bit">Pixel Art</option>
          <option value="vintage comic book art, halftone">Vintage Comic</option>
          <option value="cartoon style, bold outlines">Cartoon</option>
          <option value="pencil sketch, graphite">Pencil</option>
          <option value="crayon drawing, childlike">Crayon Drawing</option>
          <option value="3d render, octane, soft studio lighting">3D Render</option>
          <option value="flat illustration, minimal">Illustration</option>
          <option value="tattoo design, bold black lines">Tattoo Design</option>
          <option value="1990s photograph, film grain, kodak">1990s Photo</option>
          <option value="1980s photograph, film grain, kodak">1980s Photo</option>
          <option value="1950s photograph, vintage color">1950s Photo</option>
        </select>
      </div>
      <div>
        <label>Shape</label>
        <select id="resolution">
          <option value="512x512">Square</option>
          <option value="512x768">Portrait</option>
          <option value="768x512">Landscape</option>
          <option value="768x768">Large Square</option>
        </select>
      </div>
      <div>
        <label>How many?</label>
        <select id="count">
          <option>1</option><option selected>2</option><option>4</option><option>6</option><option>8</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Negative prompt</label>
        <input id="negative" placeholder="blurry, deformed, text, watermark...">
      </div>
      <div>
        <label>Creativity</label>
        <select id="guidance">
          <option value="5">Loose (5)</option>
          <option value="7" selected>Balanced (7)</option>
          <option value="12">Strict (12)</option>
          <option value="20">Very strict (20)</option>
        </select>
      </div>
      <div>
        <label>Seed</label>
        <input id="seed" type="number" placeholder="random">
      </div>
    </div>
    <button class="generate" id="go" onclick="startGenerate()">✦ Generate ✦</button>
    <div id="status"></div>
  </div>
  <div class="gallery" id="gallery">
    <div class="empty" id="empty">⟨ awaiting input ⟩ — generated images appear here</div>
  </div>
</main>
<footer>MADE BY TIOLUWALOPE · IMAGE ENGINE: <a href="https://perchance.org/ai-text-to-image-generator" target="_blank">PERCHANCE</a></footer>
<script>
  // ---- Neural network background (pure canvas, decorative) ----
  (function () {
    const c = document.getElementById('neural'), x = c.getContext('2d');
    let W, H, pts = [];
    function resize() {
      W = c.width = innerWidth; H = c.height = innerHeight;
      const n = Math.min(90, Math.floor(W * H / 16000));
      pts = Array.from({ length: n }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35
      }));
    }
    addEventListener('resize', resize); resize();
    (function draw() {
      x.clearRect(0, 0, W, H);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
      }
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 130) {
          x.strokeStyle = 'rgba(0,240,255,' + (0.16 * (1 - d / 130)) + ')';
          x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
        }
      }
      for (const p of pts) {
        x.fillStyle = 'rgba(0,240,255,.8)';
        x.beginPath(); x.arc(p.x, p.y, 1.4, 0, 7); x.fill();
      }
      requestAnimationFrame(draw);
    })();
  })();

  // ---- Official Perchance image API (iframe + postMessage, no keys) ----
  const $ = id => document.getElementById(id);
  const statusEl = $('status');
  let warmedUp = false;

  function setStatus(msg, err) { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // 1) One-time warm-up: loads perchance.org in a hidden iframe so the
  //    user's browser passes Cloudflare before we open API iframes.
  function warmUp() {
    return new Promise(res => {
      const f = document.createElement('iframe');
      f.style.display = 'none';
      f.src = 'https://perchance.org/ai-text-to-image-generator';
      const done = () => { try { f.remove(); } catch (e) {} warmedUp = true; res(true); };
      f.onload = done;
      setTimeout(done, 12000);
      document.body.appendChild(f);
    });
  }

  // 2) Generate one image: hidden API iframe + postMessage reply tagged
  //    with a unique request id.
  function generateOne(prompt, opts) {
    return new Promise((resolve, reject) => {
      const params = new URLSearchParams({ prompt, format: 'json', id: Math.random().toString(36).slice(2) });
      Object.keys(opts).forEach(k => { if (opts[k] !== '' && opts[k] != null) params.set(k, opts[k]); });
      const myId = params.get('id');
      const f = document.createElement('iframe');
      f.style.display = 'none';
      let settled = false;
      const onMsg = e => {
        const d = e.data || {};
        if (d.api !== 'perchance-image-api' || !d.result || d.result.id !== myId) return;
        cleanup();
        if (d.result.ok) resolve(d.result);
        else reject(new Error(d.result.error || 'generation failed'));
      };
      const cleanup = () => {
        if (settled) return; settled = true;
        window.removeEventListener('message', onMsg);
        try { f.remove(); } catch (e) {}
      };
      window.addEventListener('message', onMsg);
      setTimeout(() => { cleanup(); reject(new Error('timed out (retry in a minute)')); }, 300000);
      f.src = 'https://perchance.org/perchance-ai-api?' + params;
      document.body.appendChild(f);
    });
  }

  async function startGenerate() {
    const btn = $('go');
    const prompt = $('prompt').value.trim();
    if (!prompt) { setStatus('input required: add a description', true); return; }
    btn.disabled = true;
    try {
      if (!warmedUp) { setStatus('warming up neural link...'); await warmUp(); }
      const style = $('style').value;
      const fullPrompt = style ? `${prompt}, ${style}` : prompt;
      const opts = {
        negativePrompt: $('negative').value.trim(),
        resolution: $('resolution').value,
        guidanceScale: $('guidance').value,
        seed: $('seed').value || ''
      };
      const n = parseInt($('count').value, 10);
      const results = new Array(n).fill(null);
      for (let i = 0; i < n; i++) addPlaceholder(i);
      let doneCount = 0;
      const tick = setInterval(() => {
        doneCount = results.filter(Boolean).length;
        if (doneCount >= n) { clearInterval(tick); setStatus('generation complete'); btn.disabled = false; }
        else setStatus(`synthesizing ${Math.min(doneCount + 1, n)} of ${n}... (10-40s each)`);
      }, 800);
      const jobs = results.map((_, i) => generateOne(fullPrompt, opts)
        .then(r => { results[i] = r; fillCard(i, r); })
        .catch(e => { console.error(e); }));
      await Promise.all(jobs);
      clearInterval(tick);
      setStatus('generation complete');
    } catch (e) {
      setStatus('error: ' + e.message, true);
    } finally {
      btn.disabled = false;
    }
  }

  function addPlaceholder(i) {
    const empty = $('empty'); if (empty) empty.remove();
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + i;
    card.innerHTML = '<div class="placeholder">SYNTHESIZING...</div>';
    $('gallery').prepend(card);
  }

  function fillCard(i, result) {
    const card = $('card-' + i);
    const url = result.url || result.dataUrl;
    if (!url || !card) return;
    card.innerHTML = `<img src="${url}" alt="generated image">
      <div class="meta"><span class="p"></span><a href="${url}" target="_blank" rel="noopener">⬇ open</a></div>`;
    card.querySelector('.p').textContent = $('prompt').value.slice(0, 32);
  }
</script>
</body>
</html>
